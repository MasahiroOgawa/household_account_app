[project]
name = "bank-fetcher"
version = "0.1.0"
description = "Fetch bank and card statement CSVs into the household account data directory"
authors = [
    { name = "Masahiro Ogawa", email = "masahiro.ogaw@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "keyring>=25.7.0",
    "playwright>=1.63.0",
]

[project.scripts]
bank-fetcher = "bank_fetcher:main"
bank-fetcher-credentials = "bank_fetcher.credentials:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# Statements and run timestamps are in local Japanese time; naive datetimes are intended.
ignore = ["DTZ"]
